name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reweave
          POSTGRES_PASSWORD: reweave
          POSTGRES_DB: reweave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reweave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://reweave:reweave@localhost:5432/reweave_test' || '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reweave .

  # Deploys run only for pushes to main, after every check above passes, and
  # only once the DEPLOY_HOST repository variable is set.
  publish:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VITE_MAPBOX_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}
          tags: |
            ghcr.io/alyfarghali/reweave:latest
            ghcr.io/alyfarghali/reweave:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: read
    concurrency: deploy-production
    steps:
      - name: Pull the new image and restart Reweave
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The registry token goes over stdin so it never appears in a command line.
          echo "$TOKEN" | ssh deploy@"$HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin \
            && cd /opt/portfolio \
            && docker compose pull reweave \
            && docker compose up -d reweave \
            && docker logout ghcr.io"
      - name: Check the live site
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://reweave.alyfarghali.com/api/health && exit 0
            sleep 5
          done
          echo "Site did not become healthy" && exit 1
